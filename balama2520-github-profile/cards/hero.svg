<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Bala Maneesh Ayanala, full-stack developer and applied AI engineer"><defs>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#e8edf7"/><stop offset=".4" stop-color="#e8edf7"/>
<stop offset=".5" stop-color="#a8c8ff"/><stop offset=".6" stop-color="#e8edf7"/>
<stop offset="1" stop-color="#e8edf7"/><animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="2" cy="2" r="1.1" fill="#1b2744"/></pattern></defs><style>
.a{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) forwards}
.g{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow .9s ease-out forwards}
.s{opacity:0;animation:swing 1s cubic-bezier(.2,.8,.2,1) forwards}
.b{animation:pulse 1.8s ease-in-out infinite}
.n{animation:nudge 1.6s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes swing{0%{opacity:0;transform:translateY(46px) rotate(-3deg)}60%{opacity:1;transform:translateY(-6px) rotate(.8deg)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
text{font-family:'Segoe UI', Helvetica, Arial, sans-serif}</style>
<rect width="1000" height="300" rx="20" fill="#0b1220"/>
<rect width="1000" height="300" rx="20" fill="url(#dots)"/>

<text class="a" x="60" y="84" font-size="17" fill="#4f8cff" font-weight="600" style="animation-delay:0.10s">Full-stack developer, applied AI</text>
<rect class="g" x="60" y="98" width="120" height="4" rx="2" fill="url(#bar)" style="animation-delay:0.30s"/>
<text class="a" x="58" y="170" font-size="52" fill="url(#shine)" style="font-family:Georgia, 'Times New Roman', serif;animation-delay:.35s">Bala Maneesh Ayanala</text>
<text class="a" x="60" y="212" font-size="21" fill="#93a4c3" style="animation-delay:0.60s">I build AI products end to end, and ship them live.</text>
<text class="a" x="60" y="242" font-size="15" fill="#93a4c3" style="animation-delay:0.80s">Founder of Saarthi AI. IEEE-published researcher.</text>

<g class="a" style="animation-delay:1.00s">
<rect x="60" y="256" width="196" height="30" rx="15" fill="#0f2a22" stroke="#2dd4a0" stroke-opacity=".5"/>
<circle class="b" cx="80" cy="271" r="5" fill="#2dd4a0"/>
<text x="94" y="276" font-size="13" fill="#2dd4a0" font-weight="600">Open to work in India</text>
</g>

<g class="a" style="animation-delay:0.50s">
<rect x="680" y="56" width="280" height="200" rx="14" fill="#111a2e" stroke="#1f2c4a" stroke-width="2"/>
<circle cx="702" cy="80" r="5" fill="#ff5f57"/><circle cx="720" cy="80" r="5" fill="#febc2e"/><circle cx="738" cy="80" r="5" fill="#28c840"/>
</g>
<text class="a" x="702" y="122" font-size="15" fill="#2dd4a0" style="font-family:'SFMono-Regular', Consolas, 'Liberation Mono', monospace;animation-delay:1.2s">✓ saarthi → live</text><text class="a" x="702" y="152" font-size="15" fill="#2dd4a0" style="font-family:'SFMono-Regular', Consolas, 'Liberation Mono', monospace;animation-delay:1.7s">✓ smart tasks → offline</text><text class="a" x="702" y="182" font-size="15" fill="#2dd4a0" style="font-family:'SFMono-Regular', Consolas, 'Liberation Mono', monospace;animation-delay:2.2s">✓ portfolio engine → open</text><text class="a" x="702" y="212" font-size="15" fill="#4f8cff" style="font-family:'SFMono-Regular', Consolas, 'Liberation Mono', monospace;animation-delay:2.7s">› next: build more</text><text class="b" x="838" y="212" font-size="15" fill="#4f8cff" style="font-family:'SFMono-Regular', Consolas, 'Liberation Mono', monospace">▌</text>
</svg>