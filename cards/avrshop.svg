<svg xmlns="http://www.w3.org/2000/svg" width="330" height="270" viewBox="0 0 330 270" role="img" aria-label="AVR Shop: Digital marketplace for farmers + AI advisor."><defs></defs><style>
.a{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) forwards}
.g{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow .9s ease-out forwards}
.s{opacity:0;animation:swing 1s cubic-bezier(.2,.8,.2,1) forwards}
.b{animation:pulse 1.8s ease-in-out infinite}
.n{animation:nudge 1.6s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes swing{0%{opacity:0;transform:translateY(46px) rotate(-3deg)}60%{opacity:1;transform:translateY(-6px) rotate(.8deg)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
text{font-family:'Inter', 'Segoe UI', Helvetica, Arial, sans-serif}</style>
<g class="s" style="animation-delay:2.3s;transform-origin:165px 270px">
<rect x="1" y="1" width="328" height="268" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".45" stroke-width="1.5"/>
<rect x="24" y="26" width="32" height="3" rx="1.5" fill="#38bdf8"/>
<text x="24" y="54" font-size="12.5" fill="#38bdf8" font-weight="600">AgriTech E-Commerce</text>
<text class="n" x="306" y="54" font-size="18" fill="#38bdf8" text-anchor="end">↗</text>
<text x="24" y="92" font-size="26" fill="#f1f5f9" style="font-family:Georgia, 'Times New Roman', serif">AVR Shop</text>
<text x="24" y="118" font-size="13.5" fill="#94a3b8">Digital marketplace for</text><text x="24" y="140" font-size="13.5" fill="#94a3b8">farmers + AI advisor.</text>
<text x="24" y="178" font-size="11.5" fill="#38bdf8" style="font-family:'SFMono-Regular', Consolas, 'Liberation Mono', monospace">React · Node.js · Express · MongoDB</text>
<rect x="24" y="192" width="282" height="1" fill="#334155"/>
<text class="p" x="24" y="230" font-size="26" fill="#f1f5f9" font-weight="700" style="animation-delay:2.8s">MERN</text>
<text class="a" x="24" y="250" font-size="11.5" fill="#94a3b8" style="animation-delay:3.0s">stack with integrated AI</text>
</g></svg>