<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Tech stack"><defs></defs><style>
.a{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) forwards}
.g{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow .9s ease-out forwards}
.s{opacity:0;animation:swing 1s cubic-bezier(.2,.8,.2,1) forwards}
.b{animation:pulse 1.8s ease-in-out infinite}
.n{animation:nudge 1.6s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes swing{0%{opacity:0;transform:translateY(46px) rotate(-3deg)}60%{opacity:1;transform:translateY(-6px) rotate(.8deg)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
text{font-family:'Segoe UI', Helvetica, Arial, sans-serif}</style><rect width="1000" height="200" rx="18" fill="#111a2e" stroke="#1f2c4a" stroke-width="2"/><text class="a" x="40" y="44" font-size="15" fill="#4f8cff" font-weight="600" style="animation-delay:0.15s">Frontend</text><text class="a" x="160" y="44" font-size="16" fill="#e8edf7" style="animation-delay:0.2s">React · TypeScript · JavaScript · Tailwind CSS · Redux</text><text class="a" x="40" y="74" font-size="15" fill="#4f8cff" font-weight="600" style="animation-delay:0.32999999999999996s">Backend</text><text class="a" x="160" y="74" font-size="16" fill="#e8edf7" style="animation-delay:0.37999999999999995s">Node.js · Express · FastAPI · REST · WebSockets · JWT</text><text class="a" x="40" y="104" font-size="15" fill="#4f8cff" font-weight="600" style="animation-delay:0.51s">Data</text><text class="a" x="160" y="104" font-size="16" fill="#e8edf7" style="animation-delay:0.56s">PostgreSQL · MongoDB · ChromaDB</text><text class="a" x="40" y="134" font-size="15" fill="#4f8cff" font-weight="600" style="animation-delay:0.6900000000000001s">AI and ML</text><text class="a" x="160" y="134" font-size="16" fill="#e8edf7" style="animation-delay:0.7400000000000001s">RAG pipelines · LangChain · LLM integration · PyTorch · OpenCV</text><text class="a" x="40" y="164" font-size="15" fill="#4f8cff" font-weight="600" style="animation-delay:0.87s">Delivery</text><text class="a" x="160" y="164" font-size="16" fill="#e8edf7" style="animation-delay:0.92s">Docker · AWS EC2 · GitHub Actions · Vercel · Netlify · Render</text></svg>