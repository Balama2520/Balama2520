<svg xmlns="http://www.w3.org/2000/svg" width="330" height="260" viewBox="0 0 330 260" role="img" aria-label="Portfolio Engine: Fill a form, download a website. Free, with no account."><defs></defs><style>
.a{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) forwards}
.g{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow .9s ease-out forwards}
.s{opacity:0;animation:swing 1s cubic-bezier(.2,.8,.2,1) forwards}
.b{animation:pulse 1.8s ease-in-out infinite}
.n{animation:nudge 1.6s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes swing{0%{opacity:0;transform:translateY(46px) rotate(-3deg)}60%{opacity:1;transform:translateY(-6px) rotate(.8deg)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
text{font-family:'Segoe UI', Helvetica, Arial, sans-serif}</style>
<g class="s" style="animation-delay:2.0s;transform-origin:165px 260px">
<rect x="1" y="1" width="328" height="258" rx="18" fill="#111a2e" stroke="#2dd4a0" stroke-opacity=".5" stroke-width="2"/>
<rect x="24" y="28" width="36" height="4" rx="2" fill="#2dd4a0"/>
<text x="24" y="56" font-size="13" fill="#2dd4a0" font-weight="600">Open source tool</text>
<text class="n" x="306" y="56" font-size="20" fill="#2dd4a0" text-anchor="end">↗</text>
<text x="24" y="94" font-size="28" fill="#e8edf7" style="font-family:Georgia, 'Times New Roman', serif">Portfolio Engine</text>
<text x="24" y="122" font-size="14" fill="#93a4c3">Fill a form, download a website.</text><text x="24" y="144" font-size="14" fill="#93a4c3">Free, with no account.</text>
<text x="24" y="178" font-size="12" fill="#2dd4a0" style="font-family:'SFMono-Regular', Consolas, 'Liberation Mono', monospace">HTML · CSS · JavaScript</text>
<rect x="24" y="192" width="282" height="1" fill="#1f2c4a"/>
<text class="p" x="24" y="226" font-size="24" fill="#e8edf7" font-weight="700" style="animation-delay:2.5s">0 uploads</text>
<text class="a" x="24" y="246" font-size="12" fill="#93a4c3" style="animation-delay:2.7s">everything runs in your browser</text>
</g></svg>