<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Highlights: 92 percent mAP, Smart India Hackathon national finalist, 95+ Lighthouse, 5,000+ images"><defs></defs><style>
.a{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) forwards}
.g{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow .9s ease-out forwards}
.s{opacity:0;animation:swing 1s cubic-bezier(.2,.8,.2,1) forwards}
.b{animation:pulse 1.8s ease-in-out infinite}
.n{animation:nudge 1.6s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes swing{0%{opacity:0;transform:translateY(46px) rotate(-3deg)}60%{opacity:1;transform:translateY(-6px) rotate(.8deg)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
text{font-family:'Segoe UI', Helvetica, Arial, sans-serif}</style><rect width="1000" height="150" rx="18" fill="#111a2e" stroke="#1f2c4a" stroke-width="2"/>
<text class="p" x="125" y="72" font-size="42" fill="#4f8cff" text-anchor="middle" style="font-family:Georgia, 'Times New Roman', serif;animation-delay:0.2s">92%</text>
<text class="a" x="125" y="100" font-size="13" fill="#93a4c3" text-anchor="middle" style="animation-delay:0.4s">mAP in IEEE-published</text>
<text class="a" x="125" y="118" font-size="13" fill="#93a4c3" text-anchor="middle" style="animation-delay:0.45s">SAR target detection</text>
<text class="p" x="375" y="72" font-size="42" fill="#ff9f1c" text-anchor="middle" style="font-family:Georgia, 'Times New Roman', serif;animation-delay:0.45s">Top 5%</text>
<text class="a" x="375" y="100" font-size="13" fill="#93a4c3" text-anchor="middle" style="animation-delay:0.65s">Smart India Hackathon 2024</text>
<text class="a" x="375" y="118" font-size="13" fill="#93a4c3" text-anchor="middle" style="animation-delay:0.7s">national finalist</text><rect x="250" y="32" width="1" height="86" fill="#1f2c4a"/>
<text class="p" x="625" y="72" font-size="42" fill="#2dd4a0" text-anchor="middle" style="font-family:Georgia, 'Times New Roman', serif;animation-delay:0.7s">95+</text>
<text class="a" x="625" y="100" font-size="13" fill="#93a4c3" text-anchor="middle" style="animation-delay:0.8999999999999999s">Lighthouse scores on the</text>
<text class="a" x="625" y="118" font-size="13" fill="#93a4c3" text-anchor="middle" style="animation-delay:0.95s">IBM internship app</text><rect x="500" y="32" width="1" height="86" fill="#1f2c4a"/>
<text class="p" x="875" y="72" font-size="42" fill="#4f8cff" text-anchor="middle" style="font-family:Georgia, 'Times New Roman', serif;animation-delay:0.95s">5,000+</text>
<text class="a" x="875" y="100" font-size="13" fill="#93a4c3" text-anchor="middle" style="animation-delay:1.15s">SAR images processed in</text>
<text class="a" x="875" y="118" font-size="13" fill="#93a4c3" text-anchor="middle" style="animation-delay:1.2s">the denoising pipeline</text><rect x="750" y="32" width="1" height="86" fill="#1f2c4a"/></svg>