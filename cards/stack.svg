<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Tech stack: Frontend, Backend, Data, AI &amp; ML, Delivery"><defs></defs><style>
.a{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) forwards}
.g{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow .9s ease-out forwards}
.s{opacity:0;animation:swing 1s cubic-bezier(.2,.8,.2,1) forwards}
.b{animation:pulse 1.8s ease-in-out infinite}
.n{animation:nudge 1.6s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes swing{0%{opacity:0;transform:translateY(46px) rotate(-3deg)}60%{opacity:1;transform:translateY(-6px) rotate(.8deg)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
text{font-family:'Inter', 'Segoe UI', Helvetica, Arial, sans-serif}</style><rect width="1000" height="220" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text class="a" x="38" y="46" font-size="13" fill="#6366f1" font-weight="700" style="animation-delay:0.12s">Frontend</text><text class="a" x="158" y="46" font-size="14" fill="#f1f5f9" style="animation-delay:0.16999999999999998s">React · TypeScript · JavaScript · Tailwind CSS · Redux · HTML5 · CSS3</text><text class="a" x="38" y="80" font-size="13" fill="#6366f1" font-weight="700" style="animation-delay:0.28s">Backend</text><text class="a" x="158" y="80" font-size="14" fill="#f1f5f9" style="animation-delay:0.33s">Node.js · Express · FastAPI · REST APIs · WebSockets · JWT</text><text class="a" x="38" y="114" font-size="13" fill="#6366f1" font-weight="700" style="animation-delay:0.44s">Data</text><text class="a" x="158" y="114" font-size="14" fill="#f1f5f9" style="animation-delay:0.49s">PostgreSQL · MongoDB · ChromaDB · NumPy · Pandas</text><text class="a" x="38" y="148" font-size="13" fill="#6366f1" font-weight="700" style="animation-delay:0.6s">AI &amp; ML</text><text class="a" x="158" y="148" font-size="14" fill="#f1f5f9" style="animation-delay:0.65s">LangChain · RAG Pipelines · LLM Integration · PyTorch · YOLOv8 · OpenCV</text><text class="a" x="38" y="182" font-size="13" fill="#6366f1" font-weight="700" style="animation-delay:0.76s">Delivery</text><text class="a" x="158" y="182" font-size="14" fill="#f1f5f9" style="animation-delay:0.81s">Docker · AWS EC2 · GitHub Actions · Vercel · Netlify · Render</text></svg>