<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Bala Maneesh Ayanala — Full-Stack Developer &amp; AI Engineer. Founder of ABMVSC Studio."><defs>
<linearGradient id="hero-shine" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#f1f5f9"/>
<stop offset=".38" stop-color="#f1f5f9"/>
<stop offset=".5" stop-color="#a5b4fc"/>
<stop offset=".62" stop-color="#f1f5f9"/>
<stop offset="1" stop-color="#f1f5f9"/><animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#6366f1"/>
<stop offset="1" stop-color="#f97316"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
<path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="1"/>
</pattern></defs><style>
.a{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) forwards}
.g{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow .9s ease-out forwards}
.s{opacity:0;animation:swing 1s cubic-bezier(.2,.8,.2,1) forwards}
.b{animation:pulse 1.8s ease-in-out infinite}
.n{animation:nudge 1.6s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes swing{0%{opacity:0;transform:translateY(46px) rotate(-3deg)}60%{opacity:1;transform:translateY(-6px) rotate(.8deg)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
text{font-family:'Inter', 'Segoe UI', Helvetica, Arial, sans-serif}</style>
<rect width="1000" height="320" rx="20" fill="#0f172a"/>
<rect width="1000" height="320" rx="20" fill="url(#grid)" opacity=".35"/>

<!-- eyebrow -->
<text class="a" x="52" y="62" font-size="13" fill="#94a3b8" font-weight="500" style="animation-delay:0.05s">Available for work · Bangalore · Hyderabad · Remote</text>

<!-- name -->
<text class="a" x="50" y="130" font-size="54" fill="url(#hero-shine)" style="font-family:Georgia, 'Times New Roman', serif;animation-delay:.2s">Bala Maneesh Ayanala</text>

<!-- accent bar under name -->
<rect class="g" x="50" y="142" width="260" height="3" rx="1.5" fill="url(#accent-bar)" style="animation-delay:0.40s"/>

<!-- title -->
<text class="a" x="52" y="180" font-size="22" fill="#6366f1" font-weight="700" style="animation-delay:0.55s">Full-Stack Developer &amp; AI Engineer</text>

<!-- tagline -->
<text class="a" x="52" y="210" font-size="14.5" fill="#94a3b8" style="animation-delay:0.70s">I build production-ready web apps and AI-powered tools —</text>
<text class="a" x="52" y="230" font-size="14.5" fill="#94a3b8" style="animation-delay:0.80s">React · Node.js · LangChain · RAG · AWS. Founder of ABMVSC Studio.</text>

<!-- tags row -->
<g class="a" style="animation-delay:1.00s">
  <rect x="52" y="250" width="148" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-opacity=".5"/>
  <text x="126" y="268" font-size="12" fill="#6366f1" font-weight="600" text-anchor="middle">IEEE Published</text>
</g>
<g class="a" style="animation-delay:1.10s">
  <rect x="210" y="250" width="128" height="26" rx="13" fill="#1c1917" stroke="#f97316" stroke-opacity=".5"/>
  <text x="274" y="268" font-size="12" fill="#f97316" font-weight="600" text-anchor="middle">SIH Top 5%</text>
</g>
<g class="a" style="animation-delay:1.20s">
  <rect x="348" y="250" width="136" height="26" rx="13" fill="#052e16" stroke="#10b981" stroke-opacity=".5"/>
  <circle class="b" cx="366" cy="263" r="4" fill="#10b981"/>
  <text x="414" y="268" font-size="12" fill="#10b981" font-weight="600" text-anchor="middle">Open to work</text>
</g>

<!-- right: terminal panel -->
<g class="a" style="animation-delay:0.50s">
  <rect x="666" y="52" width="300" height="230" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="689" cy="76" r="5" fill="#ff5f57"/>
  <circle cx="707" cy="76" r="5" fill="#febc2e"/>
  <circle cx="725" cy="76" r="5" fill="#28c840"/>
  <text x="744" y="81" font-size="12" fill="#94a3b8" style="font-family:'SFMono-Regular', Consolas, 'Liberation Mono', monospace">~/abmvsc</text>
</g>
<text class="a" x="688" y="110" font-size="13.5" fill="#10b981" style="font-family:'SFMono-Regular', Consolas, 'Liberation Mono', monospace;animation-delay:1.3s">✦ saarthi-link    →  live</text><text class="a" x="688" y="140" font-size="13.5" fill="#10b981" style="font-family:'SFMono-Regular', Consolas, 'Liberation Mono', monospace;animation-delay:1.8s">✦ giakaa-cms      →  live</text><text class="a" x="688" y="170" font-size="13.5" fill="#10b981" style="font-family:'SFMono-Regular', Consolas, 'Liberation Mono', monospace;animation-delay:2.3s">✦ smart-tasks     →  live</text><text class="a" x="688" y="200" font-size="13.5" fill="#10b981" style="font-family:'SFMono-Regular', Consolas, 'Liberation Mono', monospace;animation-delay:2.8s">✦ avr-shop        →  live</text><text class="a" x="688" y="230" font-size="13.5" fill="#6366f1" style="font-family:'SFMono-Regular', Consolas, 'Liberation Mono', monospace;animation-delay:3.3s">› next: build more ↗</text><text class="b" x="852" y="230" font-size="14" fill="#6366f1" style="font-family:'SFMono-Regular', Consolas, 'Liberation Mono', monospace">▌</text>
</svg>